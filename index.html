<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lilacmart - Marketplace sederhana dengan pemesanan otomatis.">
  <title>Lilacmart - Pesanan Otomatis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-icon">🌸</span>
      <span><strong>Lilacmart</strong><small>Marketplace</small></span>
    </a>
    <a class="admin-link" href="admin.html">Panel Admin</a>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">TOKO ONLINE</p>
        <h1>Pesan kebutuhanmu dengan mudah.</h1>
        <p class="hero-text">Pilih produk, masukkan jumlah, lalu kirim pesanan melalui WhatsApp.</p>
        <a class="button" href="#produk">Lihat Produk</a>
      </div>
      <div class="hero-card">🌷<br><b>Lilacmart</b><br><span>Belanja praktis</span></div>
    </section>

    <section id="produk" class="section">
      <div class="section-title">
        <div><p class="eyebrow">KATALOG</p><h2>Produk Pilihan</h2></div>
        <input id="search" type="search" placeholder="Cari produk...">
      </div>
      <div id="productList" class="product-grid"></div>
    </section>
  </main>

  <footer>© <span id="year"></span> Lilacmart</footer>

  <script src="script.js"></script>
</body>
</html>
