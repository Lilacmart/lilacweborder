<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Lilacmart</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <div class="logo">🌸</div>
      <h1>Panel Admin</h1>
      <p>Login demo untuk mengelola toko.</p>
      <form id="loginForm">
        <label>Username<input id="username" required autocomplete="username"></label>
        <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Masuk</button>
        <p id="error" class="error"></p>
      </form>
      <a href="index.html">← Kembali ke toko</a>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
